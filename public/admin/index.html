<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — DOSS_UZ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <!-- Kirish -->
  <section class="login" id="login" hidden>
    <form class="form" id="login-form">
      <a class="wordmark" href="/" style="font-size:30px;text-align:center">DOSS<i>_</i>UZ</a>
      <p class="muted" style="text-align:center;margin-bottom:8px">Boshqaruv paneli</p>
      <div class="field"><label for="username">Login</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="form-error" id="login-error" role="alert" hidden></div>
      <button class="btn btn-dark btn-block" type="submit">Kirish</button>
    </form>
  </section>

  <!-- Panel -->
  <div id="panel" hidden>
    <header class="bar">
      <a class="wordmark" href="/" target="_blank" style="font-size:20px">DOSS<i>_</i>UZ</a>
      <nav class="tabs" id="tabs">
        <button type="button" data-tab="orders" class="active">Buyurtmalar <span class="pill" id="new-count" hidden></span></button>
        <button type="button" data-tab="products">Mahsulotlar</button>
      </nav>
      <button type="button" class="caps underline" id="logout">Chiqish</button>
    </header>

    <main class="wrap" style="padding-block:28px 80px">
      <div class="stats" id="stats"></div>

      <section id="tab-orders">
        <div class="head">
          <h1 class="serif">Buyurtmalar</h1>
          <label class="select"><select id="order-filter" aria-label="Holat bo‘yicha">
            <option value="">Barchasi</option>
            <option value="new">Yangi</option>
            <option value="confirmed">Tasdiqlangan</option>
            <option value="shipped">Yo‘lda</option>
            <option value="done">Yakunlangan</option>
            <option value="cancelled">Bekor qilingan</option>
          </select></label>
        </div>
        <div id="orders"></div>
      </section>

      <section id="tab-products" hidden>
        <div class="head">
          <h1 class="serif">Mahsulotlar</h1>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <input class="search-input" id="product-search" type="search" placeholder="Qidirish…" aria-label="Mahsulot qidirish">
            <button class="btn btn-dark" type="button" id="add-product" style="height:42px">+ Yangi mahsulot</button>
          </div>
        </div>
        <div class="table-wrap"><table class="table" id="products"></table></div>
      </section>
    </main>
  </div>

  <!-- Mahsulot formasi -->
  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer right editor" id="editor" aria-label="Mahsulot">
    <div class="drawer-head"><span class="caps" id="editor-title">Mahsulot</span><button class="icon-btn" type="button" id="editor-close" aria-label="Yopish">✕</button></div>
    <form class="drawer-body form" id="product-form" style="padding-top:20px">
      <div class="field"><label for="f-title">Nomi</label><input id="f-title" name="title" required maxlength="160"></div>
      <div class="two">
        <div class="field"><label for="f-category">Kategoriya</label><select id="f-category" name="category_id" required></select></div>
        <div class="field"><label for="f-price">Narxi (so‘m)</label><input id="f-price" name="price" type="number" min="0" step="1000" required></div>
      </div>
      <div class="two">
        <div class="field"><label for="f-material">Material</label><input id="f-material" name="material" maxlength="120"></div>
        <div class="field"><label for="f-brand">Brend</label><input id="f-brand" name="brand" maxlength="80"></div>
      </div>
      <div class="field"><label for="f-sizes">Razmerlar (vergul bilan)</label><input id="f-sizes" name="sizes" placeholder="M, L, XL, 2XL, 3XL"></div>
      <div class="field"><label for="f-description">Tavsif</label><textarea id="f-description" name="description" maxlength="4000"></textarea></div>
      <div class="field"><label for="f-features">Xususiyatlar (har biri yangi qatorda)</label><textarea id="f-features" name="features"></textarea></div>
      <div class="checks">
        <label><input type="checkbox" name="is_active"> Saytda ko‘rinsin</label>
        <label><input type="checkbox" name="is_new"> “Yangi” belgisi</label>
        <label><input type="checkbox" name="is_featured"> Bosh sahifada (tanlangan)</label>
      </div>

      <div class="field">
        <label>Rasm va videolar <span class="muted" style="text-transform:none;letter-spacing:0">— birinchi rasm muqova bo‘ladi</span></label>
        <div class="media-list" id="media-list"></div>
        <label class="btn btn-line upload">
          <input type="file" id="files" accept="image/jpeg,image/png,image/webp,video/mp4" multiple hidden>
          <span id="upload-label">Fayl yuklash (JPG, PNG, WEBP, MP4)</span>
        </label>
      </div>

      <div class="form-error" id="product-error" role="alert" hidden></div>
    </form>
    <div class="drawer-foot" style="display:flex;gap:10px">
      <button class="btn btn-dark" type="submit" form="product-form" id="save" style="flex:1">Saqlash</button>
      <button class="btn btn-line" type="button" id="delete" hidden>O‘chirish</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
